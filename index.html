<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的动效库 · 意群模块</title><style>
:root{color-scheme:dark;--bg:#101113;--panel:#1b1d21;--line:#303237;--text:#f1f2f4;--muted:#a5a8af;--gold:#efbc59}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1320px;margin:auto;padding:32px 28px 70px}header{display:flex;justify-content:space-between;color:var(--muted);gap:20px}header a{color:var(--muted)}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-1px;margin:38px 0 10px;line-height:1.3}p{color:var(--muted)}.intro{max-width:850px}.notice{border-left:3px solid var(--gold);padding:12px 18px;background:#211e17;color:#d9c9a9;margin:25px 0}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0}input,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}input{flex:1;min-width:180px}.count{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:20px}.card:target{border-color:var(--gold)}video{display:block;width:100%;aspect-ratio:16/9;background:#000}.body{padding:20px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}.code{color:var(--gold);font-family:monospace;font-size:15px}h2{font-size:20px;font-weight:550;margin:10px 0}.notes{min-height:52px;font-size:14px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:8px;padding:11px 15px;background:#f2f2f2;color:#111;font:inherit;cursor:pointer}button:hover{background:var(--gold)}a{color:#c6c9d0;text-underline-offset:3px}.small{font-size:12px}.status{font-size:12px;color:#b9b2a2;margin:12px 0}details{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}summary{cursor:pointer;color:#bfc2c9}audio{width:100%;margin-top:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#f5d992;color:#18130b;border-radius:9px;box-shadow:0 6px 30px #0008;z-index:5;max-width:90vw}footer{margin-top:40px;color:#858a93;font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}main{padding:22px 16px}.notes{min-height:0}header{font-size:12px}h2{font-size:19px}}[hidden]{display:none!important}
</style></head><body><main><header><span>我的动效库 / MOTION LIBRARY</span><a href="trial.html">旧试样 JJ-001</a></header><h1>按完整意群，收藏动效。</h1><p class="intro">来源：14分49秒《9月20日.mov》。连续的移动、缩放、变形和转场归在同一组，带上原时段声音。点击只复制短编号，直接发给我即可。</p><div class="notice">当前阶段：原片参考模块已拆分，可编辑复刻尚未完成。这里播放的是原片片段，不冒充重建成果。片段保留前后余量，局部重叠是为了不截断动效。</div><div class="toolbar"><input id="search" aria-label="搜索模块" placeholder="搜索编号、效果或关键词"><select id="category" aria-label="筛选类型"><option value="">全部类型</option></select><span id="count" class="count" aria-live="polite">正在载入…</span></div><section id="grid" class="grid" aria-label="意群模块"></section><footer>重复金色章节归入同一模板族，不重复凑数。当前是第一轮视觉筛选，不保证所有短促效果均已发现。<br>原片文字与署名保留，不额外添加画面装饰。音乐和音效为混合轨，未拆成独立分轨。<br><a href="modules.json">模块清单</a> · <a href="selection.md">拆分说明</a></footer></main><div id="toast" class="toast" role="status" hidden></div><textarea id="clipboard-fallback" aria-hidden="true" tabindex="-1" style="position:fixed;left:-9999px;top:0" hidden></textarea><script>
const grid=document.querySelector('#grid'),search=document.querySelector('#search'),category=document.querySelector('#category');let all=[],toastTimer;
const time=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function text(tag,value,className){const n=document.createElement(tag);n.textContent=value;if(className)n.className=className;return n}
async function copyId(id,button){let ok=false;try{await navigator.clipboard.writeText(id);ok=true}catch(e){const t=document.querySelector('#clipboard-fallback');t.hidden=false;t.value=id;t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){}t.hidden=true;button.focus()}const toast=document.querySelector('#toast');toast.textContent=ok?'已复制 '+id+'，直接粘贴给我':'复制被浏览器阻止，请允许剪贴板后重试';toast.hidden=false;button.textContent=ok?'✓ 已复制 '+id:'重试复制';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,3500)}
function render(){grid.replaceChildren();const q=search.value.trim().toLowerCase();const filtered=all.filter(m=>(!category.value||m.category===category.value)&&(!q||(m.id+m.title+m.notes).toLowerCase().includes(q)));document.querySelector('#count').textContent=filtered.length+' 组模块';for(const m of filtered){const card=text('article','', 'card');card.id=m.id;const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='none';v.poster=m.poster;v.src=m.file;v.setAttribute('aria-label',m.id+' '+m.title+' 原片参考');card.append(v);const body=text('div','','body'),meta=text('div','','meta');meta.append(text('span',m.id,'code'),text('span',m.category+' · '+time(m.start)+'–'+time(m.end)+' · '+(m.end-m.start)+'秒'));body.append(meta,text('h2',m.title),text('p',m.notes,'notes'),text('p','原片参考 · 待重建','status'));const actions=text('div','','actions'),b=text('button','复制 '+m.id);b.onclick=()=>copyId(m.id,b);const a=text('a','下载参考片段','small');a.href=m.file;a.download=m.file;actions.append(b,a);body.append(actions);const detail=document.createElement('details');detail.append(text('summary','音乐＋音效'));const au=document.createElement('audio');au.controls=true;au.preload='none';au.src=m.audioFile;detail.append(au,text('p','保留本段原混合音轨；不是独立音乐、音效分轨。','small'));const al=text('a','下载本段音轨','small');al.href=m.audioFile;al.download=m.audioFile;detail.append(al);body.append(detail);card.append(body);grid.append(card)}document.querySelectorAll('video,audio').forEach(m=>m.addEventListener('play',()=>document.querySelectorAll('video,audio').forEach(n=>{if(n!==m)n.pause()})))}
fetch('modules.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(data=>{all=data.modules;for(const c of [...new Set(all.map(m=>m.category))]){const o=text('option',c);o.value=c;category.append(o)}render();if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView()}).catch(()=>document.querySelector('#count').textContent='清单暂未载入，请刷新页面');search.addEventListener('input',render);category.addEventListener('change',render);
</script></body></html>
