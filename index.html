<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的动效库 · 可套用模板</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101113;color:#f2f2f2;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1260px;margin:auto;padding:30px 24px 64px}header{display:flex;justify-content:space-between;gap:18px;color:#a5a8af;font-size:13px}a{color:#d2d4d8;text-underline-offset:4px}h1{font-size:clamp(30px,4vw,46px);line-height:1.25;letter-spacing:-1px;margin:42px 0 15px}.intro{color:#aeb2bb;max-width:790px}.tag{display:inline-block;padding:5px 10px;background:#1d352b;color:#9bd5b4;border-radius:5px;font-size:12px}.notice{border-left:3px solid #eabc60;background:#242018;color:#d2c5a9;padding:13px 17px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:30px}.card{background:#1b1d21;border:1px solid #34363b;border-radius:12px;overflow:hidden;scroll-margin-top:20px}.card:target{border-color:#eabc60}video{display:block;width:100%;aspect-ratio:16/9;background:#000}.body{padding:19px}.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#9299a5}.id{font:16px monospace;color:#efbc59}h2{font-size:20px;line-height:1.45;font-weight:600;margin:15px 0 10px}.desc{color:#a9aeb7;font-size:14px;min-height:72px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}button{font:inherit;padding:10px 15px;border:0;border-radius:7px;background:#f1f1f1;color:#101113;cursor:pointer}button:hover{background:#f2cf8b}.secondary{font-size:12px;padding:7px 9px;background:#30333a;color:#d2d4d8}.playing{color:#92caaa;font-size:12px;margin-top:8px}details{border-top:1px solid #34363b;margin-top:18px;padding-top:14px;color:#aeb2bb;font-size:13px}summary{cursor:pointer}audio{width:100%;margin:12px 0}footer{margin-top:35px;color:#939aa5;font-size:13px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f1d594;color:#17140f;padding:12px 22px;border-radius:9px;z-index:10}.links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:12px}@media(max-width:950px){.grid{grid-template-columns:1fr}main{max-width:740px;padding:22px 17px}.desc{min-height:0}header{font-size:12px}}[hidden]{display:none!important}
</style></head><body><main><header><span>我的动效库 / MOTION LIBRARY</span><a href="reference-library.html">查看25组原片参考</a></header><h1>选一个编号，<br>把你的文案交给我。</h1><p class="intro">第一批3个可套用模板。首页播放的是已经换过内容的重建示例，不是原片。点一下复制编号，和你的文案一起发给我，由我完成内容适配和视频导出。</p><span class="tag">3个可套用 · 无需你手动改参数</span><div class="notice">音乐与音效已随模板保留，使用原时段混合音轨。当前为可编辑初版：动画主体已重建，原片的动态纹理、字体与部分过渡仍有差异，不标称逐帧一致。</div><section id="grid" class="grid" aria-label="可套用模板"></section><footer>仅这3个已接入可替换内容的动画，其余仍为原片参考。这里只取完整图形动效主体，参考段前后的无关实拍镜头不固定在模板中。<div class="links"><a href="templates.json">编号与模板对应表</a><a href="template-guide.md">套用说明</a><a href="templates-source.zip">模板源文件包</a><a href="template-qc.json">检查记录</a></div></footer></main><div class="toast" role="status" hidden></div><script>
const items=[{id:'JJ-012',name:'数字变化与时间成本',duration:'17.8秒',desc:'时薪 → 每周小时数 → 年数时钟 → 目标金额。示例已替换为人民币、中文单位与新数字。'},{id:'JJ-019',name:'倾斜词组逐行拼接',duration:'5.6秒',desc:'词组依次出现，整组倾斜、回正并轻微移动。示例已换为“寻找真正的问题和可行的解法”。'},{id:'JJ-026',name:'黑底结论逐行出现',duration:'8.13秒',desc:'保留开头黑场、三句话的依次淡入和停顿。示例已换为三句中文总结。'}];
function el(tag,text='',cls=''){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}let timer;
async function copy(id,b){let ok=false;const box=document.createElement('textarea');box.value=id;box.setAttribute('readonly','');box.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';document.body.append(box);box.focus();box.select();box.setSelectionRange(0,id.length);try{ok=document.execCommand('copy')}catch(e){}box.remove();b.focus();if(!ok){try{await navigator.clipboard.writeText(id);ok=true}catch(e){}}if(ok){b.textContent='✓ 已复制 '+id;const toast=document.querySelector('.toast');toast.textContent='已复制 '+id+'，和文案一起发给我';toast.hidden=false;clearTimeout(timer);timer=setTimeout(()=>toast.hidden=true,3500)}else{b.textContent='复制未成功，请重试'}}
for(const m of items){const card=el('article','','card');card.id=m.id;const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=m.id+'-demo.mp4';v.poster=m.id+'-demo.jpg';v.setAttribute('aria-label',m.id+' 中文套用示例');card.append(v);const b=el('div','','body'),meta=el('div','','meta');meta.append(el('span',m.id,'id'),el('span',m.duration));b.append(meta,el('h2',m.name),el('p',m.desc,'desc'),el('span','可套用 · 可编辑初版','tag'));const ctr=el('div','','controls'),copyBtn=el('button','复制 '+m.id);copyBtn.onclick=()=>copy(m.id,copyBtn);ctr.append(copyBtn);b.append(ctr);const mode=el('div','当前：中文套用示例','playing'),switches=el('div','','controls');for(const [variant,label] of [['demo','看中文套用'],['rebuild','看原文案重建']]){const btn=el('button',label,'secondary');btn.onclick=()=>{v.pause();v.src=m.id+'-'+variant+'.mp4';v.poster=m.id+'-'+variant+'.jpg';mode.textContent='当前：'+(variant==='demo'?'中文套用示例':'原文案重建（不是原片）');v.load()};switches.append(btn)}b.append(switches,mode);const links=el('div','','links');for(const [href,title] of [[m.id+'-demo.mp4','下载示例'],['reference-library.html#'+m.id,'对照原片']]){const a=el('a',title);a.href=href;links.append(a)}b.append(links);const details=document.createElement('details');details.append(el('summary','音乐＋音效'));const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=m.id+'-template.m4a';details.append(a,el('p','原时段混合音轨，与这段动画同步；未分离音乐和音效。'));const dl=el('a','下载本段声音');dl.href=m.id+'-template.m4a';details.append(dl);b.append(details);card.append(b);document.querySelector('#grid').append(card)}document.querySelectorAll('video,audio').forEach(m=>m.addEventListener('play',()=>document.querySelectorAll('video,audio').forEach(n=>{if(n!==m)n.pause()})));if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script></body></html>
